name: CI

# PR CI runs full pytest on Linux only. macOS coverage is provided by:
#   * Local dev on macOS (the primary dev machine)
#   * Release workflow's cibuildwheel matrix on tag (full cross-platform)
#
# Local pre-push gate (scripts/check.sh, auto-installed via
# scripts/install-hooks.sh) runs ruff + format + mypy + pytest locally
# before push. CI then runs Linux pytest as the safety net for the one
# class of bug local-only can't catch: Linux-specific behavior (LAPACK
# backend, libc/manylinux quirks, #82-style variance).
#
# Cost per PR: target ~5-10 min wall, free (public repo). The suite had
# grown to 43-68 min (serial pytest + uncached robot_descriptions clones);
# #348 cached the description repos and parallelized pytest (-n auto).
# Doc-only PRs skip CI entirely via paths-ignore.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Linux py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full support range: 3.10 (ROS2 Humble floor, #477) through 3.13.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs git history

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Runner info
        # Surfaces the runner's real core count up front (a standalone step so it
        # logs immediately, unlike a line inside the long pytest step). Confirms
        # whether xdist parallelism can help here. (#348)
        run: |
          echo "nproc=$(nproc)"
          python3 -c "import os; print('cpu_count', os.cpu_count(), 'affinity', len(os.sched_getaffinity(0)))"

      # Cache the robot_descriptions clones (~16 repos, several with mesh
      # files). Uncached, these clones dominate CI wall-clock (~30-55 min) and
      # cause the run-to-run variance. Keyed on MANIFEST.toml so adding an arm
      # invalidates; restore-keys lets a manifest change reuse the prior cache
      # so the prewarm step only clones the new entry. (#348)
      - name: Cache robot_descriptions
        uses: actions/cache@v4
        with:
          path: ~/.cache/robot_descriptions
          key: rd-${{ hashFiles('src/ssik/prebuilt/MANIFEST.toml') }}
          restore-keys: rd-

      - name: Pre-warm robot_descriptions
        # Serial clone before pytest so the parallel (-n auto) workers only
        # read the cache -- no concurrent clones racing on the same dir.
        run: uv run python scripts/prewarm_descriptions.py

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

      - name: regen_docs --check
        # Fail if MANIFEST.toml and the AUTOGEN doc-table regions are
        # out of sync. The script regenerates anchored tables from
        # the manifest; this gate enforces "edit MANIFEST.toml + run
        # scripts/regen_docs.py" as the only correct workflow for
        # arm metadata changes.
        run: uv run python scripts/regen_docs.py --check

      - name: pytest (parallel)
        # -n 4 (ubuntu-latest = 4 vCPUs). The heavy redundant tests (full
        # snapshot roster, etc.) are marked slow and run on the macOS pre-push
        # hook + nightly, so the per-PR suite is lean. Descriptions are
        # pre-warmed above so workers never clone concurrently. perf gates are
        # excluded here and run serially below. (#348)
        run: uv run pytest -q -n 4 -m "not slow and not perf"

      - name: pytest (perf gates, serial)
        # Wall-clock performance gates: run serially (no -n) so timing is
        # measured without cross-worker CPU contention. Small, fast set. (#348)
        run: uv run pytest -q -m "not slow and perf"

  cpp:
    # Native C++ backend (#482): the end-to-end no-drift guard (#495). Two
    # halves, both red-on-recurrence:
    #   1. cpp_emit --check: the committed constants headers (cpp/gen/<arm>.hpp,
    #      the shippable artifacts) are byte-identical to a fresh emit -- the
    #      KinBody/oracle can't silently drift from what's shipped. These are
    #      repr() of baked floats, so byte-portable across platforms.
    #   2. --all + build + ctest: regenerate the parity fixtures fresh from the
    #      *current* Linux oracle (they are FP results, not byte-portable, so not
    #      committed -- #82), then check the native solver reproduces them (FK +
    #      set-agreement conformance).
    # Neither runs in the pytest matrix, so this is the only place the native
    # artifacts are validated in CI.
    name: C++ conformance + drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs git history

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --dev --python 3.12

      - name: Install Eigen + CMake
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libeigen3-dev

      - name: cpp_emit --check (constants headers match the Python oracle)
        run: uv run python scripts/cpp_emit.py --check

      - name: Regenerate parity fixtures from the current oracle
        run: uv run python scripts/cpp_emit.py --all

      - name: Configure + build
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release && cmake --build cpp/build -j

      - name: ctest (FK + Newton golden conformance)
        run: ctest --test-dir cpp/build --output-on-failure

      - name: C++ consumer smoke (install + find_package + build + run)
        # Proves the self-contained artifacts are usable by an external C++
        # project: installs ssik_cpp to a temp prefix, then a standalone
        # downstream CMake project find_package(ssik_cpp)es it, builds the
        # example, and runs it -- no ssik source tree, no Python (#493).
        run: bash cpp/examples/consumer/smoke.sh

      - name: Build native extension into the package (pybind11)
        # Compiles the C++ solver as ssik._ssik_native (the shipped import path,
        # #506/#507) so the reused suite drives the native backend AND the
        # artifact solve(native=True) dispatch resolves it. cpp/build isn't used;
        # src/ssik/_ssik_native.so is what `from ssik import _ssik_native` finds.
        run: uv run python scripts/build_cpp_ext.py --out-dir src/ssik

      - name: Reused Python suite vs the C++ backend
        # The SAME Python tests run against the native solver -- no assertion
        # logic duplicated in C++. test_three_parallel: deep 500-pose fuzz +
        # singular + #56 on UR5. test_three_parallel_family: the 17-arm family.
        # test_native_dispatch: solve(native=True) parity + fallback (#507). cpp
        # legs / native tests skip when the ext is absent (the main matrix); here
        # it is built, so they execute.
        run: uv run pytest tests/test_three_parallel.py tests/test_three_parallel_family.py tests/test_three_parallel_boundary.py tests/test_three_parallel_artifact.py tests/test_native_dispatch.py tests/test_feasible_arcs.py -q

  native_wheel:
    # Ships the native extension in the wheel (#506). cibuildwheel runs only on
    # release tags, so this validates the wheel build + native bundling on PRs:
    # build a wheel on Linux + macOS, install it, and native-solve through the
    # shipped ssik._ssik_native. Without this the native ship is unexercised
    # until a release tag.
    name: Native wheel build — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs git history

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Eigen (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libeigen3-dev

      - name: Install Eigen (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen

      - name: Build wheel
        run: uv build --wheel

      - name: Install wheel + native smoke
        run: |
          uv venv .wheelenv
          uv pip install --python .wheelenv/bin/python dist/*.whl numpy
          .wheelenv/bin/python scripts/native_smoke.py
