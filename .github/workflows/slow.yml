name: Slow suite

# The `-m slow` tests (full snapshot roster, sympy cross-checks, slow-build
# codegen, deep per-arm fuzz) are excluded from PR CI to keep it lean, so they
# run here nightly, on Linux with the native extension built, like ci.yml's
# test job. Nothing else runs them, and #611 found seven of them had failed
# unnoticed. A failure shows as a failed scheduled run. Run it by hand from the
# Actions tab, or `gh workflow run slow.yml --ref <branch>`, before merging a
# change that the slow suite covers.
#
# Two jobs. `slow`: pytest takes 12-14 min on a 4-vCPU runner, and ~11-13 min
# of that is the Rizon 4 composer test alone, which bounds the wall-clock
# however the suite is sharded. It also runs the exhaustive sweeps
# (`-m sweep`, tests/_sweeps.py) in full, which most PRs run only as a fixed
# sample; they run on the workers beside the Rizon 4 test and add ~5 min of
# wall-clock on an EPYC 7763 runner (pytest 18.7 min). `native_parity`: the full tier of the
# native-parity gate (tests/test_native_parity.py, #626), on its own runner so
# it adds no wall-clock to `slow`.

on:
  schedule:
    - cron: "17 8 * * *"  # daily, 08:17 UTC
  workflow_dispatch:
    inputs:
      regen:
        description: >-
          Instead of running the native-parity gate, regenerate its Linux data
          (scripts/regen_native_parity.py) and upload it as native-parity-data
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slow:
    name: Linux py3.12 slow suite
    if: ${{ !inputs.regen }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs git history

      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --dev --python 3.12

      - name: Runner info
        run: |
          echo "nproc=$(nproc)"
          lscpu | grep "Model name"

      # Shares ci.yml's robot_descriptions cache (same key), so the prewarm
      # step only clones what a manifest change added.
      - name: Cache robot_descriptions
        uses: actions/cache@v4
        with:
          path: ~/.cache/robot_descriptions
          key: rd-${{ hashFiles('src/ssik/prebuilt/MANIFEST.toml') }}
          restore-keys: rd-

      - name: Pre-warm robot_descriptions
        run: uv run python scripts/prewarm_descriptions.py

      - name: Build native extension into the package (pybind11)
        # native=True is the shipped default, so the slow suite must run
        # against it, not the Python fallback. build_cpp_ext.py fetches the
        # pinned Eigen itself (#606); no system Eigen.
        run: uv run python scripts/build_cpp_ext.py --out-dir src/ssik

      - name: pytest -m "slow or sweep" (parallel)
        # The native-parity gate runs in its own job below. SSIK_PR_SWEEPS is
        # empty, so every sweep runs in full.
        env:
          SSIK_PR_SWEEPS: ""
        run: >-
          uv run pytest -q -n 4 --dist worksteal -m "slow or sweep" --durations=25
          --ignore=tests/test_native_parity.py

  native_parity:
    name: Linux py3.12 native-parity gate (full tier)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs the history

      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --dev --python 3.12

      - name: Build native extension into the package (pybind11)
        run: uv run python scripts/build_cpp_ext.py --out-dir src/ssik

      - name: pytest -m slow tests/test_native_parity.py (parallel)
        if: ${{ !inputs.regen }}
        # loadgroup keeps each arm's cells on one worker, so an arm's poses are
        # solved once (its cells share a per-process cache), not once per worker.
        run: >-
          uv run pytest -q -n 4 --dist loadgroup -m slow tests/test_native_parity.py
          --durations=10

      - name: Regenerate the gate's Linux cells, witnesses and oracle verdicts
        if: ${{ inputs.regen }}
        run: uv run python scripts/regen_native_parity.py -j 4

      - name: Upload the regenerated data
        if: ${{ inputs.regen }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: native-parity-data
          path: tests/data/native_parity_*.json
          if-no-files-found: error
          retention-days: 7
